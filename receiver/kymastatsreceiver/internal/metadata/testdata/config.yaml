default:
all_set:
  metrics:
    kyma.resource.status.conditions:
      enabled: true
      attributes: ["group","kind","name","namespace","reason","status","type","version"]
    kyma.resource.status.state:
      enabled: true
      attributes: ["group","kind","name","namespace","state","version"]
  resource_attributes:
    k8s.namespace.name:
      enabled: true
    k8s.resource.group:
      enabled: true
    k8s.resource.kind:
      enabled: true
    k8s.resource.name:
      enabled: true
    k8s.resource.version:
      enabled: true
reaggregate_set:
  metrics:
    kyma.resource.status.conditions:
      enabled: true
      attributes: []
    kyma.resource.status.state:
      enabled: true
      attributes: []
  resource_attributes:
    k8s.namespace.name:
      enabled: true
    k8s.resource.group:
      enabled: true
    k8s.resource.kind:
      enabled: true
    k8s.resource.name:
      enabled: true
    k8s.resource.version:
      enabled: true
none_set:
  metrics:
    kyma.resource.status.conditions:
      enabled: false
      attributes: ["group","kind","name","namespace","reason","status","type","version"]
    kyma.resource.status.state:
      enabled: false
      attributes: ["group","kind","name","namespace","state","version"]
  resource_attributes:
    k8s.namespace.name:
      enabled: false
    k8s.resource.group:
      enabled: false
    k8s.resource.kind:
      enabled: false
    k8s.resource.name:
      enabled: false
    k8s.resource.version:
      enabled: false
filter_set_include:
  resource_attributes:
    k8s.namespace.name:
      enabled: true
      metrics_include:
        - regexp: ".*"
    k8s.resource.group:
      enabled: true
      metrics_include:
        - regexp: ".*"
    k8s.resource.kind:
      enabled: true
      metrics_include:
        - regexp: ".*"
    k8s.resource.name:
      enabled: true
      metrics_include:
        - regexp: ".*"
    k8s.resource.version:
      enabled: true
      metrics_include:
        - regexp: ".*"
filter_set_exclude:
  resource_attributes:
    k8s.namespace.name:
      enabled: true
      metrics_exclude:
        - strict: "k8s.namespace.name-val"
    k8s.resource.group:
      enabled: true
      metrics_exclude:
        - strict: "k8s.resource.group-val"
    k8s.resource.kind:
      enabled: true
      metrics_exclude:
        - strict: "k8s.resource.kind-val"
    k8s.resource.name:
      enabled: true
      metrics_exclude:
        - strict: "k8s.resource.name-val"
    k8s.resource.version:
      enabled: true
      metrics_exclude:
        - strict: "k8s.resource.version-val"

default:
all_set:
  metrics:
    dummy:
      enabled: true
      attributes: ["host"]
  resource_attributes:
    k8s.cluster.name:
      enabled: true
reaggregate_set:
  metrics:
    dummy:
      enabled: true
      attributes: []
  resource_attributes:
    k8s.cluster.name:
      enabled: true
none_set:
  metrics:
    dummy:
      enabled: false
      attributes: ["host"]
  resource_attributes:
    k8s.cluster.name:
      enabled: false
filter_set_include:
  resource_attributes:
    k8s.cluster.name:
      enabled: true
      metrics_include:
        - regexp: ".*"
filter_set_exclude:
  resource_attributes:
    k8s.cluster.name:
      enabled: true
      metrics_exclude:
        - strict: "k8s.cluster.name-val"
